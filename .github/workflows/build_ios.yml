name: Build iOS App

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Unduh Dependency
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Kemas Menjadi Berkas IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r LaporanHarian.ipa Payload
          cd ../../..

      - name: Unggah Berkas IPA
        uses: actions/upload-artifact@v4
        with:
          name: LaporanHarian-iOS
          path: build/ios/ipa/LaporanHarian.ipa
          retention-days: 7
